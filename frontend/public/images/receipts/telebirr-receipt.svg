<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <style>
      .tb-blue { fill: #0072BC; }
      .tb-dark { fill: #002B49; }
      .amount-tb { font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0072BC; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #6B7280; font-weight: 500; }
      .val-tb { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #111827; font-weight: 600; }
    </style>
  </defs>

  <!-- Paper background -->
  <rect width="600" height="840" fill="#F8FAFC" rx="16"/>
  <rect x="24" y="24" width="552" height="792" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Telebirr Top Bar Accent (Cyan & Blue) -->
  <path d="M 24 38 Q 24 24 38 24 L 562 24 Q 576 24 576 38 L 576 104 L 24 104 Z" fill="#0072BC"/>
  <rect x="24" y="100" width="552" height="4" fill="#00AEEF"/>

  <!-- Header Branding -->
  <g transform="translate(48, 44)">
    <rect x="0" y="4" width="44" height="44" rx="22" fill="#FFFFFF"/>
    <text x="22" y="32" text-anchor="middle" font-size="20" font-weight="900" fill="#0072BC">tb</text>
    <text x="56" y="24" font-size="20" font-weight="800" fill="#FFFFFF">telebirr • ቴሌብር</text>
    <text x="56" y="42" font-size="13" font-weight="500" fill="#E0F2FE">Ethio Telecom Mobile Money • Transaction Receipt</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(48, 126)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#ECFDF5"/>
    <circle cx="16" cy="13" r="5" fill="#10B981"/>
    <text x="30" y="17" font-size="11" font-weight="700" fill="#065F46">PAYMENT SUCCESSFUL</text>
  </g>

  <g transform="translate(410, 142)">
    <text x="0" y="0" font-size="12" font-weight="500" fill="#64748B">Instant Settlement</text>
  </g>

  <!-- Amount Highlight Card -->
  <g transform="translate(48, 170)">
    <rect x="0" y="0" width="504" height="104" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <text x="24" y="34" font-size="12" font-weight="700" fill="#0369A1" letter-spacing="1">AMOUNT TRANSFERRED (በኢትዮጵያ ብር)</text>
    <text x="24" y="78" class="amount-tb">55,000.00 <tspan font-size="20" font-weight="600">ETB</tspan></text>
    <text x="480" y="72" text-anchor="end" font-size="12" font-weight="500" fill="#64748B">Fifty-Five Thousand Birr</text>
  </g>

  <!-- Key Transaction Details -->
  <g transform="translate(48, 304)">
    <text x="0" y="0" class="lbl">Telebirr Transaction ID</text>
    <text x="0" y="22" class="val-tb" font-family="monospace">TB260901M55009</text>

    <text x="280" y="0" class="lbl">Date &amp; Time (EAT)</text>
    <text x="280" y="22" class="val-tb">September 01, 2026 • 11:45 AM</text>

    <line x1="0" y1="44" x2="504" y2="44" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Sender -->
    <text x="0" y="72" class="lbl">Sender (Tenant)</text>
    <text x="0" y="94" class="val-tb">Mikias Bekele</text>
    <text x="0" y="112" font-size="12" fill="#64748B">Account: +251 92 233 4455</text>

    <!-- Receiver -->
    <text x="280" y="72" class="lbl">Receiver (Landlord)</text>
    <text x="280" y="94" class="val-tb">HomeLink Landlord (Dev Landlord)</text>
    <text x="280" y="112" font-size="12" fill="#64748B">Account: +251 91 122 3344 (Verified Merchant)</text>

    <line x1="0" y1="134" x2="504" y2="134" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Property & Purpose -->
    <text x="0" y="162" class="lbl">Payment Purpose</text>
    <text x="0" y="184" class="val-tb">Rent for Spacious 3BR Villa in CMC</text>

    <text x="280" y="162" class="lbl">Rental Month</text>
    <text x="280" y="184" class="val-tb">September 2026</text>

    <line x1="0" y1="210" x2="504" y2="210" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="0" y="238" class="lbl">Platform Order ID</text>
    <text x="0" y="258" class="val-tb" font-family="monospace">HL-AGR-CMC-2026-09</text>

    <text x="280" y="238" class="lbl">Payment Method</text>
    <text x="280" y="258" class="val-tb">Telebirr SuperApp / USSD *127#</text>
  </g>

  <!-- Digital Seal -->
  <g transform="translate(360, 620)">
    <rect x="0" y="0" width="190" height="84" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <circle cx="30" cy="42" r="16" fill="#16A34A"/>
    <text x="30" y="47" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">✓</text>
    <text x="58" y="32" font-size="11" font-weight="800" fill="#15803D">TELEBIRR VERIFIED</text>
    <text x="58" y="48" font-size="10" font-weight="600" fill="#16A34A">ELECTRONIC RECEIPT</text>
    <text x="58" y="64" font-size="9" fill="#64748B">SETTLED IN FULL</text>
  </g>

  <!-- QR -->
  <g transform="translate(48, 620)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="10" y="10" width="22" height="22" fill="#0072BC"/>
    <rect x="14" y="14" width="14" height="14" fill="#FFF"/>
    <rect x="17" y="17" width="8" height="8" fill="#0072BC"/>

    <rect x="48" y="10" width="22" height="22" fill="#0072BC"/>
    <rect x="52" y="14" width="14" height="14" fill="#FFF"/>
    <rect x="55" y="17" width="8" height="8" fill="#0072BC"/>

    <rect x="10" y="48" width="22" height="22" fill="#0072BC"/>
    <rect x="14" y="52" width="14" height="14" fill="#FFF"/>
    <rect x="17" y="55" width="8" height="8" fill="#0072BC"/>

    <rect x="40" y="40" width="10" height="10" fill="#0072BC"/>

    <text x="96" y="36" font-size="11" font-weight="600" fill="#334155">Scan with Telebirr App</text>
    <text x="96" y="54" font-size="10" fill="#64748B">verify.telebirr.et/?tx=TB260901M55009</text>
  </g>

  <g transform="translate(48, 770)">
    <line x1="0" y1="0" x2="504" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    <text x="252" y="24" text-anchor="middle" font-size="10" fill="#94A3B8">
      Electronic proof of payment generated by telebirr for HomeLink Ethiopia.
    </text>
  </g>
</svg>
